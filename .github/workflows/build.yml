name: Build and Release

# A v* tag builds, signs and publishes a release. A tag ending in -signtest (e.g.
# v2.9.1-signtest.1) runs the same signed build and checks but publishes nothing:
# for testing signing changes without a release. Delete the test tag afterwards.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# The v2.8.0 tag push produced two runs; serialise per tag so a duplicate run waits
# instead of racing the first one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGN_TEST: ${{ contains(github.ref_name, '-signtest') }}

jobs:
  build:
    runs-on: windows-latest
    # Code signing: Azure Artifact Signing (account SlateAccount, profile Slate, the same
    # certificate as Slate), signed in to with GitHub's OIDC token, so no password is
    # stored anywhere. Azure trusts only jobs in this repository's "release" environment
    # (subject repo:jamesccupps/NoteForge:environment:release), and the environment only
    # v* tags. The secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID say
    # which app registration ("Slate signing"). scripts/azure-sign.js does the signing.
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      # Don't leave the write token in .git/config for npm ci, babel and the tests;
      # the steps that need it get it as GH_TOKEN
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # A tag that doesn't match package.json would publish a latest.yml with the wrong
      # version (updaters would loop or skip)
      - name: Tag matches package.json
        if: env.SIGN_TEST != 'true'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; fi

      # npm ci installs exactly what package-lock.json records
      - name: Install dependencies
        run: npm ci

      - name: Compile JSX
        run: npm run build:jsx

      # Nothing is published if any test fails
      - name: Unit tests
        run: npm test

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The version scripts/azure-sign.js imports (the one azure/artifact-signing-action
      # v2.0.0 uses for Slate)
      - name: Install the ArtifactSigning module
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force

      # electron-builder 26's PublishManager awaits between looking up and caching its GitHub
      # publisher, so concurrent uploads (installer, blockmap) each get one and each create a
      # release: v2.8.1 came out split across two releases from a single run. Create one draft
      # up front so every upload finds it, and publish it only once all assets are attached.
      - name: Create draft release
        if: env.SIGN_TEST != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]")==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "NoteForge $v" --notes-file release-notes.md

      # Each file is signed as electron-builder makes it (the app exe before it is packed,
      # the uninstaller, the installer, the portable exe), so latest.yml's hash is the
      # signed installer's
      - name: Build, sign and upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NOTEFORGE_AZURE_SIGN: "1"
        run: npx electron-builder --win --publish ${{ env.SIGN_TEST == 'true' && 'never' || 'always' }}

      # The draft stays unpublished if the shipped exe lacks a fuse package.json asks for
      - name: Check fuses in the built exe
        run: node test/check_fuses.js

      # ...or if anything shipped isn't validly signed by James Cupps, or the app wouldn't
      # check its next update's signature
      - name: Check signatures
        shell: pwsh
        run: |
          $want = 'CN=James Cupps, O=James Cupps'
          $files = @(Get-ChildItem dist -Filter *.exe) + @(Get-Item dist\win-unpacked\NoteForge.exe)
          if ($files.Count -lt 3) { throw "expected the installer, the portable exe and the app exe, found: $($files.Name -join ', ')" }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            # (as an annotation, so the result can be read without signing in to GitHub)
            "::notice title=Signature::$($f.Name): $($s.Status), $($s.SignerCertificate.Subject), timestamped: $([bool]$s.TimeStamperCertificate)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) isn't validly signed: $($s.StatusMessage)" }
            if (-not $s.SignerCertificate.Subject.StartsWith($want)) { throw "$($f.Name) is signed by $($s.SignerCertificate.Subject)" }
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name) has no timestamp" }
          }
          $yml = Get-Content dist\win-unpacked\resources\app-update.yml -Raw
          if ($yml -notmatch [regex]::Escape($want)) { throw "app-update.yml has no publisherName, so the app wouldn't verify its updates:`n$yml" }

      # Unversioned copies of the installer and the portable exe, so
      # releases/latest/download/NoteForge-Setup.exe (and NoteForge-portable.exe) always
      # fetch the newest release: a one-click link for the README and the site. The
      # versioned files stay as they are; latest.yml (the auto-updater) and the Scoop
      # manifest name them. The copies are the files just checked, byte for byte.
      - name: Attach unversioned copies
        if: env.SIGN_TEST != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp "dist/NoteForge-Setup-$v.exe" dist/NoteForge-Setup.exe
          cp "dist/NoteForge-$v-portable.exe" dist/NoteForge-portable.exe
          gh release upload "$GITHUB_REF_NAME" dist/NoteForge-Setup.exe dist/NoteForge-portable.exe

      - name: Publish the release
        if: env.SIGN_TEST != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          if [ "$n" != "1" ]; then echo "::error::expected one release for $GITHUB_REF_NAME, found $n"; exit 1; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

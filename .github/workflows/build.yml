name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# GitHub delivered the v2.8.0 tag push twice; both runs raced electron-builder's
# "find or create release" and produced two v2.8.0 releases. Serialise per tag so a
# duplicate run finds the release the first one created.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json records
      - name: Install dependencies
        run: npm ci

      - name: Compile JSX
        run: npm run build:jsx

      # Nothing is published if any test fails
      - name: Unit tests
        run: npm test

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish always

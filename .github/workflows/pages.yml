# NoteForge's site on GitHub Pages (https://jamesccupps.github.io/NoteForge/): the page in
# site/ with the screenshots from docs/screenshots and the app icon. Runs when any of those
# change on main. The download links and version come from the latest release when the
# page loads, so a release needs no new deploy.
# (Settings → Pages → Source must be "GitHub Actions".)
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "assets/icon.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The page and its images
        run: |
          mkdir -p pages/images
          cp -r site/. pages/
          cp docs/screenshots/noteforge-*.png docs/screenshots/social-preview.png pages/images/
          cp assets/icon.png pages/images/icon.png
          find pages | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # IndexNow: tell Bing (and Yandex, Seznam, Naver, Yep) the page changed, so it's
      # re-crawled now rather than whenever. The key is public by design: it's served at
      # https://jamesccupps.github.io/6f4669f95049414a71045ac20c1d6046.txt (jamesccupps.github.io repository), which
      # proves the site is ours. A failed ping is a warning, never a failed deploy.
      - name: Tell IndexNow the page changed
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
          KEY: 6f4669f95049414a71045ac20c1d6046
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"jamesccupps.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"https://jamesccupps.github.io/$KEY.txt\",\"urlList\":[\"$PAGE\"]}") || true
          case "$code" in
            200|202) echo "IndexNow accepted (HTTP $code)" ;;
            *) echo "::warning title=IndexNow::not submitted (HTTP $code)" ;;
          esac
